[package]
name = "japan-agent"
version = "0.1.0"
edition = "2024"
description = "Devserver helper for the Japan 2027 trip app: git sync of the trip data and Web Push."
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-push-native = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
